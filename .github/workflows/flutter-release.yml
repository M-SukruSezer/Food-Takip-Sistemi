# Flutter uygulamasini bes platform icin derler.
#
# Linux ve Android burada da derlenebiliyor ama asil sebep Windows ve iOS:
# o ikisi yerel makinede (Ubuntu) derlenemiyor. Ciktilar is akisi artifact'i
# olarak iner; imzalama ve magaza yuklemesi bu akisin disindadir.
name: Flutter Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

defaults:
  run:
    working-directory: flutter_app

env:
  FLUTTER_VERSION: '3.47.5'
  # Derlemeye gomulu API adresi; uygulama kullaniciya sunucu adresi sormaz.
  API_URL: 'https://food-takip-sistemi.vercel.app/api'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: flutter_app/build/web

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Imzasiz APK: kurulum icin "bilinmeyen kaynak" izni gerekir.
      # Magaza yuklemesi icin release imzasi eklenmelidir.
      - run: flutter build apk --release --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Masaustu derleme bagimliliklari
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: flutter_app/build/linux/x64/release/bundle

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_URL=${env:API_URL}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: flutter_app/build/windows/x64/runner/Release

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Imzasiz derleme: App Store / TestFlight icin Apple Developer hesabi ve
      # sertifika gerekir, o adim bu akista yok.
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: flutter_app/build/ios/iphoneos/Runner.app
