<!-- Tailwind CSS v3 CDN with plugins -->

<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',

<!-- BEGIN: Custom Animation Styles -->
<style data-purpose="scanner-animations">
    @keyframes scanLaser {
      0% {
        top: 6%;
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
      100% {
        top: 92%;
        opacity: 0.2;
      }
    }
    .animate-laser {
      animation: scanLaser 2.6s ease-in-out infinite alternate;
    }

    @keyframes pulseTarget {
      0%, 100% {
        border-color: rgba(16, 185, 129, 0.9);
        box-shadow: 0 0 24px rgba(16, 185, 129, 0.25), inset 0 0 20px rgba(16, 185, 129, 0.15);
      }
      50% {
        border-color: rgba(52, 211, 153, 0.4);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.1), inset 0 0 8px rgba(16, 185, 129, 0.05);
      }
    }
    .scanner-target-pulse {
      animation: pulseTarget 3s ease-in-out infinite;
    }
  </style>
<!-- END: Custom Animation Styles -->
</head>
<body class="bg-neutral-900 text-slate-800 antialiased font-sans flex justify-center items-center min-h-screen selection:bg-brand-500 selection:text-white">

<!-- Corner Accents for high-tech camera scanner feel -->
<div class="absolute top-2 left-2 w-6 h-6 border-t-4 border-l-4 border-emerald-400 rounded-tl-xl"></div>
<div class="absolute top-2 right-2 w-6 h-6 border-t-4 border-r-4 border-emerald-400 rounded-tr-xl"></div>
<div class="absolute bottom-2 left-2 w-6 h-6 border-b-4 border-l-4 border-emerald-400 rounded-bl-xl"></div>
<div class="absolute bottom-2 right-2 w-6 h-6 border-b-4 border-r-4 border-emerald-400 rounded-br-xl"></div>

<button class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 hover:bg-white/20 active:bg-white/30 text-white text-xs font-medium backdrop-blur-md border border-white/15 transition-all" data-purpose="manual-code-btn" type="button">
